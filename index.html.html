<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>Adjektivdeklination – Interaktives Grammatiktraining</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#183047;background:#edf4f8}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:14px max(16px,calc((100vw - 960px)/2));position:relative;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px #15283c22}header strong{font-size:clamp(16px,3.7vw,22px)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ffb703;outline-offset:2px}.home{border:3px solid #ffffff;background:#ffffff;color:#10243a;border-radius:15px;min-width:58px;min-height:58px;font-size:30px;box-shadow:0 2px 12px #0004;display:grid;place-items:center;flex-shrink:0}main{max-width:960px;margin:auto;padding:20px 14px 60px}.hero{padding:26px 22px;background:linear-gradient(125deg,#163650,#087d87);color:white;border-radius:20px;margin-bottom:20px}h1{font-size:clamp(26px,6vw,38px);margin:0 0 8px}h2{font-size:clamp(22px,4.5vw,28px)}h3{font-size:20px}.muted{color:#5c6e7b}.hero .muted{color:#e0f4f4}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.tile,.panel{background:white;border:1px solid #d4e1e9;border-radius:17px;padding:18px;box-shadow:0 3px 9px #1930470b}.tile{display:flex;flex-direction:column;gap:8px}.tile h3{margin:0}.tile p{margin:0 0 8px;flex:1}.btn{background:#087b83;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:750;min-height:48px}.btn.secondary{background:#e6eef4;color:#19364b}.btn.outline{background:white;color:#087b83;border:2px solid #087b83}.btn.warn{background:#7b3f0a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.actions button{flex:1 1 150px}.hidden{display:none!important}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tabs button{flex:1 1 170px}.tabs .selected{background:#10243a;color:white}.tablewrap{overflow-x:auto;margin:15px 0;border-radius:12px;border:1px solid #cbdce6}table{width:100%;border-collapse:collapse;min-width:620px;background:white}th,td{border:1px solid #d9e3ea;padding:10px;text-align:left;font-size:14px}th{background:#dbeaf1}td b{color:#006a72}.note{background:#e9f6f5;border-left:5px solid #087b83;border-radius:8px;padding:13px 15px;margin:15px 0}.example{margin:9px 0}.exercise-line{font-size:17px;line-height:2.65;margin:0 0 12px}.exercise-line .blank{vertical-align:middle}.blank{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;vertical-align:middle;margin:2px 3px}.blank input{width:63px;max-width:22vw;min-height:45px;border:2px solid #8296a7;border-radius:9px;text-align:center;font-size:18px;font-weight:750;color:#183047;background:white}.blank.ok input{background:#b9f4c8;border:3px solid #078332;color:#06491e}.blank.bad input{background:#ffe0df;border:3px solid #c72828;color:#8d1717}.blank.missing input{background:#fff0c4;border:3px solid #ae7400}.mark{font-weight:900;font-size:21px}.ok .mark{color:#087c2f}.bad .mark{color:#b82020}.missing .mark{color:#9d6c00}.solution{display:block;font-size:12px;line-height:1.25;color:#8a1e1e;font-weight:750;white-space:normal;max-width:145px}.progress{height:11px;background:#dfe8ee;border-radius:50px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#0b9380;transition:width .2s}.score{font-size:19px;font-weight:800;padding:15px;background:#e6f7ed;border-radius:12px}.group{margin:20px 0}.group{scroll-margin-top:100px}.group-controls{display:flex;gap:9px;flex-wrap:wrap;border-top:3px solid #b5d7db;padding:16px 0;margin:18px 0 30px}.group-controls button{flex:1 1 170px}.group h3{padding:10px 12px;background:#e4eef4;border-radius:10px}.help{margin-top:20px}.help summary{cursor:pointer;font-weight:750;padding:13px;background:#e6eef4;border-radius:10px}.fine{font-size:13px}.pill{display:inline-block;border-radius:100px;background:#e7f1f4;padding:4px 10px;font-size:13px;font-weight:700}.reading{line-height:2.6;font-size:17px}.reading .blank{line-height:1.3}footer{text-align:center;color:#607486;font-size:13px;margin-top:30px}@media(max-width:500px){main{padding:13px 10px 48px}.panel{padding:13px}.exercise-line,.reading{font-size:16px;line-height:2.8}.blank input{width:56px;font-size:17px}.tile{padding:16px}.hero{padding:20px 17px}header{padding:10px 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Clearly visible checkpoints after each case, optimized for touchscreens. */
.group{border:2px solid #c7dde4;border-radius:17px;padding:16px;background:#fff;margin:20px 0 26px;scroll-margin-top:105px}
.group h3{background:#e3eef5;padding:12px 14px;border-radius:10px;margin:0 0 14px}
.section-label{margin-top:18px;padding:13px 14px 7px;text-align:center;font-weight:800;color:#12455a;background:#e9f5f6;border-radius:12px 12px 0 0}
.group-controls{background:#e9f5f6;border-top:0!important;border-bottom:5px solid #0a7d85;border-radius:0 0 12px 12px;padding:9px 12px 14px!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.group-controls .btn{min-height:54px;padding:10px 8px;font-size:14px}
@media(max-width:650px){.group{padding:10px}.group-controls{grid-template-columns:1fr}.group-controls .btn{width:100%;min-height:52px;font-size:16px}.exercise-line{line-height:2.3}}
 .page-home{display:flex;align-items:center;gap:10px;margin:0 0 15px}.page-home .home{background:#fff;border:2px solid #087b83;box-shadow:0 2px 8px #0002;min-width:52px;min-height:52px;font-size:27px}.page-home span{font-weight:700;color:#24506a} </style></head><body><header><strong>Adjektivdeklination</strong><span style="margin-left:auto;font-size:13px">Deutschtraining</span></header><main id="app"></main><script>
'use strict';
const grammar={
weak:{title:'Schwache Deklination',sub:'Gyenge melléknévragozás',lead:'Határozott névelő és az ahhoz hasonlóan ragozott mutató/általános névmások után.',words:'der, die, das; dieser, jener, jeder, mancher, solcher, welcher, derselbe, beide, alle (a megfelelően ragozott alakokban).',rows:[['Nominativ','der jung<b>e</b> Mann','die schön<b>e</b> Frau','das klein<b>e</b> Kind','die neu<b>en</b> Häuser'],['Akkusativ','den jung<b>en</b> Mann','die schön<b>e</b> Frau','das klein<b>e</b> Kind','die neu<b>en</b> Häuser'],['Dativ','dem jung<b>en</b> Mann','der schön<b>en</b> Frau','dem klein<b>en</b> Kind','den neu<b>en</b> Häusern'],['Genitiv','des jung<b>en</b> Mannes','der schön<b>en</b> Frau','des klein<b>en</b> Kindes','der neu<b>en</b> Häuser']],rule:'A melléknév végződése csak -e vagy -en. -e: egyes szám alanyesetben, valamint nőnem és semlegesnem tárgyesetben; minden más helyen -en.'},
strong:{title:'Starke Deklination',sub:'Erős melléknévragozás',lead:'Névelő nélkül, illetve bizonyos mennyiségjelölő szavak után, ha azok nem hordozzák az eset- és nemjelölést.',words:'Névelő nélkül; einige, viele, wenige, mehrere; etwas, genug, mehr, viel, wenig (a szerkezetnek megfelelően); wessen, dessen, deren; számnevek után.',rows:[['Nominativ','blau<b>er</b> Himmel','frisch<b>e</b> Luft','schön<b>es</b> Wetter','kalt<b>e</b> Tage'],['Akkusativ','blau<b>en</b> Himmel','frisch<b>e</b> Luft','schön<b>es</b> Wetter','kalt<b>e</b> Tage'],['Dativ','blau<b>em</b> Himmel','frisch<b>er</b> Luft','schön<b>em</b> Wetter','kalt<b>en</b> Tagen'],['Genitiv','blau<b>en</b> Himmels','frisch<b>er</b> Luft','schön<b>en</b> Wetters','kalt<b>er</b> Tage']],rule:'A melléknév általában a határozott névelő eset- és nemjelölő végződését kapja. Kivétel: hímnem és semlegesnem egyes szám birtokos esetében -en.'},
mixed:{title:'Gemischte Deklination',sub:'Vegyes melléknévragozás',lead:'Az ein-típusú névelők és birtokos determinánsok után.',words:'ein, kein; mein, dein, sein, ihr, unser, euer, Ihr; was für ein. Többes számban a kein és a birtokos determinánsok után -en.',rows:[['Nominativ','ein alt<b>er</b> Baum','eine schön<b>e</b> Rose','ein gut<b>es</b> Buch','keine kalt<b>en</b> Tage'],['Akkusativ','einen alt<b>en</b> Baum','eine schön<b>e</b> Rose','ein gut<b>es</b> Buch','keine kalt<b>en</b> Tage'],['Dativ','einem alt<b>en</b> Baum','einer schön<b>en</b> Rose','einem gut<b>en</b> Buch','keinen kalt<b>en</b> Tagen'],['Genitiv','eines alt<b>en</b> Baumes','einer schön<b>en</b> Rose','eines gut<b>en</b> Buches','keiner kalt<b>en</b> Tage']],rule:'Erős végződés: hímnem alanyeset (-er), semlegesnem alany- és tárgyeset (-es). Nőnem alany- és tárgyeset: -e. Minden más esetben: -en.'}}
const tasks=[
{title:'Systematisches Training',desc:'Nominativ · Akkusativ · Dativ · Genitiv',type:'groups',groups:[
['Nominativ',[["neu|er| Bahnhof","ein neu|er| Bahnhof","der neu|e| Hauptbahnhof"],["neu|es| Schild","ein neu|es| Schild","das neu|e| Schild für Elektro-Tankstellen"],["neu|e| Straße","eine neu|e| Straße","die neu|e| Umgehungsstraße"],["neu|e| Parkplätze","neu|e| Parkplätze","die neu|en| Parkplätze für die Schule"]]],
['Akkusativ',[["ohne historisch|en| Platz","für einen historisch|en| Platz","für den historisch|en| Rathausplatz"],["für modern|es| Wohnen","für ein modern|es| Haus","für das modern|e| Rathaus"],["ohne alt|e| Brücke","für eine alt|e| Brücke","ohne die alt|e| Fußgängerbrücke"],["für grün|e| Busse","für grün|e| Busse","für die grün|en| Elektrobusse"]]],
['Dativ',[["mit gut|em| Wein","mit meinem nett|en| Freund","mit dem nett|en| Freund meiner Schwester"],["bei gut|em| Wetter","zu keinem neu|en| Café","in dem nett|en| Café"],["bei gut|er| Musik","mit meiner nett|en| Kollegin","zu der nett|en| Nachbarin"],["von nett|en| Kollegen","von nett|en| Kollegen","von den nett|en| Kollegen"]]],
['Genitiv',[["wegen laut|en| Verkehrs","wegen eines laut|en| Lkws","wegen des laut|en| Lkws vor dem Haus"],["trotz gut besucht|en| Kinos","trotz eines gut besucht|en| Kinos","trotz des gut besucht|en| Kinos"],["wegen defekt|er| Bahn","wegen einer defekt|en| Bahn","wegen der defekt|en| Bahn"],["trotz viel|er| Unfälle","trotz viel|er| Unfälle","trotz der viel|en| Unfälle"]]]]},
{title:'Lust auf Mode',desc:'Ein zusammenhängender Text mit 22 Lücken',type:'text',paragraphs:[`„Wie Urlaub im sonnig|en| Süden (m.)“ lautete das Motto der gestrig|en| Modenschau (f.) in der gemütlich|en| Lobby (f.) des bekannt|en| Hotels (n.) „Dolce“ am Marktplatz. Das bekannt|e| Modeatelier (n.) „Martha Ovambo“ hat in entspannt|er| Atmosphäre (f.) seine diesjährig|e| Kollektion (f.) präsentiert und die potenziell|en| Kunden (Pl.) und Kundinnen mit den aktuell|en| Trends (Pl.) vertraut gemacht.`, `Die Mode (f.) dieser Saison ist alltagstauglich|∅| und sportlich|∅|. Klar|e| Linien (Pl.), hell|e| Farben (Pl.) und bequem|e| Stoffe (Pl.), das sind die Leitlinien. Aber trotz der viel|en| sportlich|en| Schnitte (Pl.) dürfen romantisch|e| Kleider (Pl.) natürlich nicht fehlen.`, `Die Mitarbeiterinnen präsentierten die Kleider mit einer perfekt|en| Choreografie (f.), mit anregend|er| Musik (f.) und natürlich gut|er| Laune (f.). Wenn Sie gestern nicht an diesem wunderbar entspannend|en| Event (n.) teilnehmen konnten, können Sie hier einen Blick auf die neuest|en| Modetrends (Pl.) werfen: www.mode-ovambo.de.`]},
{title:'Urlaubserinnerungen',desc:'Besondere Begleiter und Mengenwörter',type:'text',paragraphs:[`Ich bin schon manch|es| Mal in den Süden in Urlaub gefahren. Ich erinnere mich besonders an jen|en| Urlaub am Mittelmeer. Das war ein Urlaub, in dem all|e| Beteiligten krank geworden sind. Wir mussten mit beid|en| Kindern etlich|e| Male zum Arzt fahren. Es war gar nicht so einfach, irgendein|en| Arzt zu finden, der Deutsch sprechen konnte.`, `Solch|e| Probleme hat man nicht, wenn man in ein Land fährt, dessen Sprache man spricht oder in dem viel|e| Leute Deutsch sprechen. Deshalb fahren wir seit einig|en| Jahren in den Norden, nach Schweden, denn wir können etwas Schwedisch. Natürlich gibt es dort manchmal auch viel|∅| Regen. Wir haben mehrer|e| Tage in Museen verbracht, um dem schlechten Wetter zu entgehen.`, `Aber die Mittsommernächte sind fantastisch. In all|en| Orten wird gefeiert und man sieht lauter|∅| festlich gekleidete Menschen auf den Straßen und Plätzen.`]},
{title:'Viele und alle',desc:'Fünf Sätze mit Adjektivendungen',type:'text',paragraphs:[`1. Trotz vieler groß|er| Chancen konnte der TSC Assenheim das Spiel nicht gewinnen.`,`2. Er lud alle anwesend|en| Kollegen zu Kaffee und Kuchen ein.`,`3. Bei vielen älter|en| Programmen gibt es Probleme.`,`4. Ich habe schon in vielen unterschiedlich|en| Betrieben gearbeitet.`,`5. Alle Verwandt|en| und Bekannt|en| sind zur Feier eingeladen.`]},
{title:'Im Büro',desc:'Was für ein und welcher?',type:'text',paragraphs:[`1. Man kann sich kaum vorstellen, was für ein unglaublich|er| Lärm bei offenem Fenster ins Büro dringt.`,`2. In welchem größ er|en| Büro ist es schon ganz ruhig?`,`3. Ich weiß auch nicht, welche sinnvoll|en| Maßnahmen man ergreifen könnte, um Ruhe bei der Arbeit zu haben.`,`4. Ich muss immer daran denken, was für ein groß|es| Privileg es für mich ist, im Homeoffice arbeiten zu können.`]}
];
// Normalize the spelling of the comparative stem before rendering.
tasks[4].paragraphs[1]='2. In welchem größer|en| Büro ist es schon ganz ruhig?';
// The photographed systematic exercise contains one item in each of 3 columns for each gender/case.
// Some sentences include intentional repeats; they are retained as separate practice items.
let current='home', active=0, tab='weak', checked=false, solutions=false, values={}, groupChecks={}, groupSolutions={}, groupRanges=[], currentGroup=-1;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function go(page,index){current=page;if(index!==undefined)active=index;checked=false;solutions=false;values={};groupChecks={};groupSolutions={};render();window.scrollTo({top:0,behavior:'instant'});}
function table(k){let g=grammar[k];return `<div class="panel"><h2>${g.title}</h2><p class="muted">${g.sub}</p><p>${g.lead}</p><div class="note"><b>Nach welchen Wörtern?</b><p>${g.words}</p></div><div class="tablewrap"><table><thead><tr><th>Kasus</th><th>Maskulinum</th><th>Femininum</th><th>Neutrum</th><th>Plural</th></tr></thead><tbody>${g.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p><b>Regel:</b> ${g.rule}</p></div>`;}
function pageHome(){return `<div class="page-home"><button class="home" data-go="home" aria-label="Zur Startseite" title="Zur Startseite">🏠</button><span>Zur Startseite</span></div>`;}
function grammarUI(){return `${pageHome()}<h1>Grammatikübersicht</h1><p>Válaszd ki a ragozási típust. A táblázatok jobbra görgethetők telefonon.</p><div class="tabs">${Object.entries(grammar).map(([k,g])=>`<button class="btn ${tab===k?'selected':'secondary'}" data-tab="${k}">${g.title}</button>`).join('')}</div>${table(tab)}<div class="panel" style="margin-top:15px"><h3>Besonderheiten – Fontos kivételek</h3><p><b>dunkel → dunkle</b>, <b>sauer → saure</b> (gyakori hangkiesés); <b>hoch → hohe</b> (a c kiesik). Példák: die dunkle Nacht, der saure Apfel, das hohe Haus.</p><p>A <b>super, prima, lila, rosa</b> jelzők hagyományos használatban ragozatlanok: eine prima Idee, eine lila Bluse. A városnévből képzett <b>-er</b> jelzők nagybetűsek és ragozatlanok: der Frankfurter Flughafen, das Budapester Parlament.</p><p><b>Figyelem:</b> A <i>viel, wenig, manch, solch</i> ragozása a szerkezettől és a használattól is függhet. Például: <i>viel Regen</i>, de <i>viele Leute</i>; <i>manches Mal</i>, <i>manche Tage</i>.</p></div><div class="actions"><button class="btn" data-go="home">Zur Startseite</button></div>`;}
function homeUI(){return `<section class="hero"><h1>Adjektivdeklination</h1><p>Interaktives Grammatiktraining · 5 Übungen</p><p class="muted">Lerne die Regeln, ergänze die Endungen und kontrolliere anschließend deine Antworten.</p></section><h2>1. Grammatik</h2><div class="tiles">${Object.entries(grammar).map(([k,g])=>`<article class="tile"><span class="pill">Regeln + Tabelle</span><h3>${g.title}</h3><p>${g.sub}</p><button class="btn" data-grammar="${k}">Tabelle ansehen</button></article>`).join('')}</div><h2>2. Übungen</h2><div class="tiles">${tasks.map((t,i)=>`<article class="tile"><span class="pill">Übung ${i+1} von 5</span><h3>${t.title}</h3><p class="muted">${t.desc}</p><button class="btn" data-task="${i}">Übung starten →</button></article>`).join('')}</div><div class="note">Tipp: In Übung 1 kannst du Nominativ, Akkusativ, Dativ und Genitiv einzeln überprüfen. In den übrigen Übungen kontrollierst du den ganzen Text. Richtige Antworten erscheinen deutlich grün, falsche rot. Du kannst Fehler korrigieren und erneut prüfen.</div>`;}
let answerMap=[];
function blank(stem,ans){let id=answerMap.length;answerMap.push(ans);let v=values[id]??'';let right=v.trim().toLowerCase()===ans.toLowerCase()||(ans==='∅'&&['-','0','keine'].includes(v.trim().toLowerCase()));let localChecked=checked||(currentGroup>=0&&groupChecks[currentGroup]);let localSolutions=solutions||(currentGroup>=0&&groupSolutions[currentGroup]);let state=localChecked?(right?'ok':v.trim()?'bad':'missing'):'';return `<span class="blank ${state}"><span>${esc(stem)}</span><input aria-label="Endung ${id+1} nach ${esc(stem)}" data-id="${id}" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="8" value="${esc(v)}" placeholder="${id+1}"/><span class="mark">${localChecked?(right?'✓':v.trim()?'✕':'!'):''}</span>${localSolutions&&!right?`<span class="solution">${ans==='∅'?'keine Endung':esc(ans)}</span>`:''}</span>`;}
function parse(s){return s.split(/(\S*\|(?:er|es|en|em|e|∅|er|n|r|s)\|)/g).map(piece=>{let m=piece.match(/^(.+)\|([^|]+)\|$/);return m?blank(m[1],m[2]):esc(piece)}).join('');}
function taskUI(){answerMap=[];let t=tasks[active];let content='';if(t.type==='groups'){groupRanges=[];content=t.groups.map(([name,rows],gi)=>{currentGroup=gi;let begin=answerMap.length;let body=rows.map(row=>`<p class="exercise-line">${row.map(s=>parse(s)).join(' · ')}</p>`).join('');let end=answerMap.length;groupRanges.push([begin,end]);let right=answerMap.slice(begin,end).filter((a,j)=>{let v=(values[begin+j]??'').trim().toLowerCase();return v===a.toLowerCase()||(a==='∅'&&['-','0','keine'].includes(v))}).length;return `<section class="group"><h3>${name}</h3>${body}<div class="section-label">✓ Abschnitt fertig? Jetzt diesen Teil kontrollieren</div><div class="group-controls"><button class="btn" data-group-check="${gi}">✓ ${name} überprüfen</button><button class="btn secondary" data-group-sol="${gi}">${groupSolutions[gi]?'Lösungen ausblenden':'Lösungen anzeigen'}</button><button class="btn outline" data-group-reset="${gi}">↻ Neu beginnen</button></div>${groupChecks[gi]?`<p class="score">${name}: ${right} / ${end-begin} richtig</p>`:''}</section>`}).join('');currentGroup=-1}else{content=t.paragraphs.map(p=>`<p class="reading">${parse(p)}</p>`).join('')};let count=answerMap.length,correct=answerMap.filter((a,i)=>{let v=(values[i]??'').trim().toLowerCase();return v===a.toLowerCase()||(a==='∅'&&['-','0','keine'].includes(v))}).length;return `<div>${pageHome()}<span class="pill">Übung ${active+1} / 5</span><h1>${t.title}</h1><p class="muted">${t.desc}</p><p>Ergänze nur die fehlende Endung. Wenn keine Endung nötig ist, schreibe <b>–</b> (Bindestrich). Bei Übung 1 kannst du jeden Kasus einzeln überprüfen.</p><div class="progress"><div style="width:${count?Object.values(values).filter(v=>v.trim()).length/count*100:0}%"></div></div><div class="panel">${content}</div>${checked?`<p class="score" role="status">${correct} / ${count} richtig · ${Math.round(correct/count*100)} %</p>`:''}<div class="actions"><button class="btn" data-action="check">✓ Überprüfen</button><button class="btn secondary" data-action="solutions">${solutions?'Lösungen ausblenden':'Lösungen anzeigen'}</button><button class="btn outline" data-action="reset">↻ Neu beginnen</button></div><details class="help"><summary>📖 Grammatikhilfe öffnen</summary><div class="tabs">${Object.entries(grammar).map(([k,g])=>`<button class="btn ${tab===k?'selected':'secondary'}" data-tab="${k}">${g.title}</button>`).join('')}</div>${table(tab)}</details><div class="actions"><button class="btn secondary" data-go="home">🏠 Startseite</button>${active<4?`<button class="btn" data-task="${active+1}">Nächste Übung →</button>`:''}</div><p class="fine muted">Die Eingaben bleiben beim Prüfen und beim Öffnen der Grammatikhilfe erhalten. „Neu beginnen“ löscht sie vollständig.</p></div>`;}
function render(){app.innerHTML=current==='home'?homeUI():current==='grammar'?grammarUI():taskUI();app.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>go('task',+b.dataset.task));app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));app.querySelectorAll('[data-grammar]').forEach(b=>b.onclick=()=>{tab=b.dataset.grammar;go('grammar')});app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(current==='task')saveInputs();tab=b.dataset.tab;let open=current==='task'&&!!app.querySelector('details.help[open]');render();if(open)app.querySelector('details.help').open=true;});app.querySelectorAll('input[data-id]').forEach(inp=>inp.addEventListener('input',()=>{values[+inp.dataset.id]=inp.value;checked=false;solutions=false;let gi=groupRanges.findIndex(([a,b])=>+inp.dataset.id>=a&&+inp.dataset.id<b);if(gi>=0){groupChecks[gi]=false;groupSolutions[gi]=false}inp.closest('.blank').className='blank';inp.closest('.blank').querySelector('.mark').textContent='';inp.closest('.blank').querySelector('.solution')?.remove();app.querySelector('.score')?.remove();}));app.querySelectorAll('[data-group-check],[data-group-sol],[data-group-reset]').forEach(b=>b.onclick=()=>{saveInputs();let gi=+(b.dataset.groupCheck??b.dataset.groupSol??b.dataset.groupReset);if(b.hasAttribute('data-group-check')){groupChecks[gi]=true;groupSolutions[gi]=false}else if(b.hasAttribute('data-group-sol')){groupSolutions[gi]=!groupSolutions[gi];groupChecks[gi]=true}else{let [a,z]=groupRanges[gi];for(let i=a;i<z;i++)delete values[i];groupChecks[gi]=false;groupSolutions[gi]=false}render();document.querySelectorAll('.group')[gi]?.scrollIntoView({block:'start'});});app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{saveInputs();if(b.dataset.action==='check'){checked=true;solutions=false}else if(b.dataset.action==='solutions'){solutions=!solutions;checked=true}else if(b.dataset.action==='reset'){values={};checked=false;solutions=false;groupChecks={};groupSolutions={}}render();});}
function saveInputs(){app.querySelectorAll('input[data-id]').forEach(inp=>values[+inp.dataset.id]=inp.value)}render();
</script><footer>Adjektivdeklination · Offline-fähig · Für Smartphone und Computer</footer></body></html>
